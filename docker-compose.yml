# Local run for API only (MongoDB Atlas)
services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Server
      PORT: "8080"
      NODE_ENV: development

      # MongoDB Atlas (base URI only; app appends DB name from src/constants.js)
      MONGODB_URI: ${MONGODB_URI}

      # CORS: "*" or comma-separated origins (used with credentials: true)
      CORS_ORIGIN: ${CORS_ORIGIN}

      # JWT — in production keep these different and 32+ chars each
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}

      # Optional: internal cron auth
      CRON_SECRET: ${CRON_SECRET:-}

      # Optional cookie overrides
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
